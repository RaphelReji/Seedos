<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeedOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="intro">

       <img src="assets/intro/seed.png" alt="Seed">
       
       <h1>SeedOS</h1>
       <p>Every great tree start as a seed.</p>

       <div class="loader">
        <div class="progress"></div>

       </div>

    </div>
    
    <div class="desktop" id="desktop">

        <header class="top-bar">

          <h1>SeedOS</h1>  
         <div class="time" id="clock">
            00:00
         </div>
        </header>

      <main class="desktop-icons">

        <div class="icon" id="grow-icon">
            <img src="assets/icons/grow.png" alt="Grow">
            <p>Grow</p>
        </div>

        <div class="icon" id="journal-icon">
            <img src="assets/icons/journal.png" alt="journal">
            <P>journal</P>
        </div>

        <div class="icon" id="settings-icon">
            <img src="assets/icons/settings.png" alt="Settings">
            <P>Settings</P>
        </div>

      </main>  

      <div class="window" id="grow-window">
        <div class="window-header">
            <span>🌱 Grow</span>
            <button id="close-grow">✕</button>
        </div>

        <div class="window-body">
            <div class="folder">📂 My Plants</div>
            <div class="folder">📂 Projects</div>
            <div class="folder">📂 Archive</div>
        </div>

      </div>

      <diV class="window" id="journal-window">
        <div class="window-header">
            <span>📖 Journal</span>
            <button id="close-journal">✕</button>
        </div>

        <div class="window-body">

            <textarea id="journal-text" 
            placeholder="write your thoughts here..."></textarea>
            

        </div>

    </div>

    <div class="window" id="settings-window">
        <div class="window-header">
            <span>⚙️ Settings</span>

        <button id="close-settings">✕</button>
        </div>
        <div class="window-body">
            <h3 id="h31">Wallpaper</h3>
            <button id="day-theme"> Day Theme</button>
            <button id="night-theme">Night Theme</button>

            <h3 id="h31">Accent Color</h3>

            <div class="colors">
                <button class="green"></button>
                <button class="blue"></button>
                <button class="orange"></button>
            </div>
            <button id="reset-theme">🔄 Reset</button>
        </div>
    </div>
      <footer class="dock">
        <div class="theme-buttons">
            <button id="day-btn">🌞</button>
            <button id="night-btn">🌙</button>
        </div>
        <button class="home-btn">
            Home
        </button>

        <p>SeedOS</p>

      </footer>

    </div>
    <footer class="credits">

Made with 🌱 by Raphel

</footer>

    <script src="script.js"></script>

</body>

</html>
